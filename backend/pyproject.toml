[project]
name = "tonemill"
version = "0.1.0"
description = "Async GPU video color-grading pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "dramatiq[redis]>=1.17",
    "aioboto3>=13.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.1",
    "structlog>=24.4",
    # Used by tools/tune_profile.py (FR-017) AND hlg-gpu's per-source auto-contrast
    # (research.md #11) -- the latter runs in the worker at job time, so this is a real
    # runtime dependency now, not dev-only.
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    # [server]: aioboto3 talks real HTTP, so tests run moto as a local server rather than
    # the mock_aws decorator (which doesn't support aiobotocore's async response objects).
    "moto[s3,server]>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonemill"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes defaults; I: isort (import sorting) so a
# separate isort tool is never needed, per project convention.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tonemill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.12"
